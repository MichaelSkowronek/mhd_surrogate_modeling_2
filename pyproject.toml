[project]
name = "mhd-surrogate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michael Skowronek", email = "michael.skowronek.91@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
    "zarr>=3.4.0",
    "pyyaml>=6.0.3",
    "imageio-ffmpeg>=0.6.0",
    # Pinned to a pre-release: stable hydra-core (<=1.3.7) is broken on
    # Python 3.14 (upstream bug, facebookresearch/hydra#3121 -- its argparse
    # setup fails under Python 3.14's stricter argparse validation). 1.4.0.dev9
    # fixes it. Swap for the stable 1.4.0 release once it ships.
    "hydra-core==1.4.0.dev9",
    "jax>=0.11.2",
    "mlflow>=3.16.1",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# Only the MLflow tracking *server* needs these (Postgres backend store and
# S3 artifact store); training clients talk to it over HTTP without them.
server = [
    "psycopg2-binary>=2.9",
    "boto3>=1.35",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dvc[s3]>=3.67.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# src/mhd_surrogate/ only, not scripts/**/*.py: CLAUDE.md's Testing section
# deliberately excludes CLI/argparse/plotting glue from the "must be
# unit-tested" rule, and that glue dominates line counts in scripts/,
# so a coverage number there would be meaningless (and a gate on it would
# pressure writing tests for argparse setup just to hit a target).
source = ["src/mhd_surrogate"]

[tool.coverage.report]
fail_under = 95
show_missing = true
