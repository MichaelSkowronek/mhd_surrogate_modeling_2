# Local orchestration: the training/analysis container plus an MLflow tracking
# stack that mirrors a production layout --
#
#   app --HTTP--> mlflow server --SQL--> postgres   (runs, params, metrics)
#                      \--S3 API--> seaweedfs      (artifacts)
#
# All state lives in bind mounts inside the project (data/, reports/,
# outputs/, mlflow/postgres/, mlflow/seaweedfs/), not in Docker-managed
# volumes, so `docker compose down -v` or a volume prune can't delete it.
#
#   docker compose up -d                           # start the stack, UI on :5000
#   docker compose run --rm app                    # default: training entrypoint
#   docker compose run --rm app python scripts/analysis/run_all_checks.py
#   docker compose run --rm test                   # pytest in the container
#   docker compose run --rm app-gpu                # same, on the NVIDIA GPU (needs the
#                                                  # NVIDIA Container Toolkit, see README)
#
# Credentials below are local-development defaults, overridable via .env
# (see .env.example).

x-app: &app
  build:
    context: .
    target: runtime
  image: mhd-surrogate:latest
  # Ray's object store lives in /dev/shm (64 MB by default in a container).
  shm_size: 1gb
  volumes:
    - ./data:/app/data
    - ./reports:/app/reports
    - ./outputs:/app/outputs
    - ./models:/app/models
    # Read at run time to record which data version a run used (data/raw.dvc
    # arrives through the data/ mount).
    - ./dvc.lock:/app/dvc.lock:ro

x-s3-credentials: &s3-credentials
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-mlflow}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-mlflow-secret}

services:
  postgres:
    image: postgres:18-alpine
    # Run as the host user so the bind-mounted data stays owned by you.
    # (/etc/passwd is mounted because initdb needs the UID to resolve.)
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow}
      POSTGRES_DB: mlflow
    volumes:
      - ./mlflow/postgres:/var/lib/postgresql
      - /etc/passwd:/etc/passwd:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # Single-process master + volume + filer + S3 gateway (port 8333).
    command: ["server", "-dir=/data", "-s3"]
    environment:
      <<: *s3-credentials
    # S3 gateway published to the host (loopback only) so `dvc push/pull`
    # can use it as the data remote; containers reach it as seaweedfs:8333.
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - ./mlflow/seaweedfs:/data

  # One-shot: create the buckets -- `mlflow` (run artifacts) and `dvc` (the
  # DVC remote for raw data) -- retrying until SeaweedFS is up.
  s3-init:
    image: amazon/aws-cli:2.27.0
    depends_on: [seaweedfs]
    environment:
      <<: *s3-credentials
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        for bucket in mlflow dvc; do
        until aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket $$bucket
        || aws --endpoint-url http://seaweedfs:8333 s3 mb s3://$$bucket;
        do echo "waiting for seaweedfs..."; sleep 2; done;
        done
    restart: "no"

  mlflow:
    <<: *app
    depends_on:
      postgres: {condition: service_healthy}
      s3-init: {condition: service_completed_successfully}
    environment:
      <<: *s3-credentials
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
    command:
      - mlflow
      - server
      - --backend-store-uri=postgresql://mlflow:${POSTGRES_PASSWORD:-mlflow}@postgres:5432/mlflow
      # Clients upload artifacts to the server, which writes them to S3, so
      # they need no S3 credentials or endpoint knowledge.
      - --artifacts-destination=s3://mlflow
      - --serve-artifacts
      - --host=0.0.0.0
      - --port=5000
      # MLflow rejects requests whose Host header isn't allow-listed (DNS
      # rebinding protection); add the in-network name the app uses.
      - --allowed-hosts=mlflow:5000,localhost:5000,127.0.0.1:5000
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    <<: *app
    depends_on:
      mlflow: {condition: service_healthy}
    command:
      - python
      - scripts/training/train.py
      - mlflow=server
      - mlflow.tracking_uri=http://mlflow:5000
    profiles: ["run"]

  # The app on the GPU: the same entrypoint on an image built with the `gpu`
  # extra (CUDA wheels), with the host GPU reserved for the container. A
  # separate service so the default image and CI stay CPU-only.
  app-gpu:
    extends:
      service: app
    build:
      context: .
      target: runtime
      args:
        UV_EXTRAS: --extra server --extra ray --extra gpu
    image: mhd-surrogate:gpu
    environment:
      # Allocate GPU memory on demand rather than preallocating 75% of it,
      # which fails when the GPU is shared with a desktop (see train.py).
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: ["gpu"]

  test:
    build:
      context: .
      target: test
    image: mhd-surrogate:test
    profiles: ["test"]
