repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # dvc.lock is written by DVC, which wraps long `cmd` lines with a
      # trailing space; stripping it changes nothing (YAML folds the break
      # into one space) but fails the commit after every retrain.
      - id: trailing-whitespace
        exclude: ^dvc\.lock$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # The serving image's tag in the overlay Argo CD deploys: the content hash
  # of the image's inputs as they are staged (scripts/serving/image_tag.py).
  # Rewrites the pin when an input changed, failing the commit once, as a
  # fixer does: stage the pin with the change.
  - repo: local
    hooks:
      - id: serving-image-pin
        name: pin the serving image
        entry: python3 scripts/serving/image_tag.py --pin deploy/k8s/overlays/kind/kustomization.yaml
        language: system
        pass_filenames: false
        files: ^(Dockerfile|\.dockerignore|pyproject\.toml|uv\.lock|README\.md|src/|scripts/|configs/|deploy/k8s/overlays/kind/kustomization\.yaml)
