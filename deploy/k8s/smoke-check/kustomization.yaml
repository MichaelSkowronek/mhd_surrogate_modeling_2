# The deployment's post-sync check, apart from base/: the base's labels go
# into selectors, which a Job's must not have, and its pod mustn't carry the
# server's labels, or the Service would send it requests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mhd-serving
resources:
  - job.yaml
