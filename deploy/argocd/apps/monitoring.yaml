# Prometheus, Grafana, Alertmanager and the Prometheus operator: the
# kube-prometheus-stack chart, pinned. A third-party chart, so Helm (the
# service's own manifests are Kustomize, deploy/k8s). The service brings its
# ServiceMonitor and dashboard itself (deploy/k8s/monitoring).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.2.0
    helm:
      releaseName: monitoring
      valuesObject:
        # kind's control-plane components listen on localhost only, where
        # Prometheus can't scrape them: their scrapes would only fail.
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        prometheus:
          prometheusSpec:
            # Select every ServiceMonitor and rule, not only the chart's.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            retention: 7d
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
        alertmanager:
          # The forecast service's alerts (team: mhd-surrogate, set by its
          # PrometheusRule) go out by email through Gmail's SMTP server; the
          # chart's own stay in Alertmanager (kind trips several of them,
          # e.g. KubePodNotReady for its static control-plane pods). The SMTP
          # password is the Secret alertmanager-smtp, kept out of git
          # (deploy/argocd/smtp-secret.sh) and mounted at
          # /etc/alertmanager/secrets/alertmanager-smtp. Helm merges this
          # with the chart's config: the inhibit rules and templates are the
          # chart's, the routes and receivers these.
          # tests/serving/test_alert_routing.py checks the routing (amtool).
          alertmanagerSpec:
            secrets:
              - alertmanager-smtp
          config:
            global:
              smtp_smarthost: smtp.gmail.com:587
              smtp_from: michael.skowronek.91@gmail.com
              smtp_auth_username: michael.skowronek.91@gmail.com
              smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
            route:
              receiver: "null"
              group_by: [alertname]
              group_wait: 30s
              group_interval: 5m
              # A still-firing alert is mailed again twice a day.
              repeat_interval: 12h
              routes:
                - receiver: email
                  matchers:
                    - team = "mhd-surrogate"
            receivers:
              - name: "null"
              - name: email
                email_configs:
                  - to: michael.skowronek.91@gmail.com
                    send_resolved: true
        grafana:
          # On localhost:8082 (deploy/kind/cluster.yaml); dashboards from
          # ConfigMaps labeled grafana_dashboard in any namespace.
          service:
            type: NodePort
            nodePort: 30082
          sidecar:
            dashboards:
              searchNamespace: ALL
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The operator's CRDs are too large for client-side apply.
      - ServerSideApply=true
