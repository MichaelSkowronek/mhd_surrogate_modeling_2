# Argo CD itself: the upstream install manifest, pinned to a release, with
# local settings. Applied once by deploy/argocd/bootstrap.sh; from then on
# Argo CD manages it like everything else (deploy/argocd/apps/argocd.yaml),
# so an upgrade is a change of this file.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml
patches:
  # Plain HTTP: the UI and API are reachable on localhost only
  # (deploy/kind/cluster.yaml), and TLS there would only add a warning page.
  - target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
    patch: |-
      - op: add
        path: /data
        value:
          server.insecure: "true"
  # On localhost:8081 (deploy/kind/cluster.yaml).
  - target:
      kind: Service
      name: argocd-server
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30081
