name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # uv sync auto-provisions the pinned Python version (.python-version);
      # no separate Python setup step needed. Installs the dev dependency
      # group (pytest, pytest-cov) by default, plus the `ray` extra (the
      # parallel-backend tests start a local Ray runtime).
      - run: uv sync --extra ray

      # Coverage (src/mhd_surrogate/ only, gated at 95% -- see pyproject.toml's
      # [tool.coverage] comment for why scripts/ is out of scope) is wired in
      # here rather than via pytest addopts, so a local `pytest tests/foo.py`
      # subset run stays fast and doesn't spuriously fail the threshold --
      # only this full-suite CI run is gated.
      # Validates dvc.yaml/data/raw.dvc structure. No data is pulled: the DVC
      # remote is the local compose stack, which CI doesn't have.
      - run: uv run dvc dag

      - run: uv run pytest --cov --cov-report=term-missing
