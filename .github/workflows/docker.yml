name: docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# packages: write -- the serving image is pushed to GitHub's container
# registry (ghcr.io) from here.
permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # `docker compose up --wait` doesn't reliably fail fast on every container
    # error (see the HOST_UID/HOST_GID note below for a case that hung it
    # rather than failing); this is a hard backstop against the job running
    # for GitHub's default 6h job limit instead.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

      - uses: docker/setup-buildx-action@v4.4.1

      # Build both targets once here (cached via the GitHub Actions cache
      # backend) and load them into the runner's local Docker so the
      # `docker compose` steps below reuse them instead of rebuilding.
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: runtime
          tags: mhd-surrogate:latest
          # On a PR, the merge commit: the tree the image is actually built from.
          build-args: GIT_COMMIT=${{ github.sha }}
          load: true
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: test
          tags: mhd-surrogate:test
          load: true
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test

      # Same suite as the `tests` workflow, but against the image's
      # non-editable install rather than an editable one -- deliberately
      # not redundant, see CLAUDE.md's Testing section (this is what would
      # catch a bug that only breaks non-editably, as one already has).
      # The zarr store isn't present in CI, so the 6 data-contract tests skip.
      - run: docker run --rm mhd-surrogate:test

      - run: docker compose config -q

      # The serving image (README, "Image publishing"): tagged with the hash
      # of its inputs (scripts/serving/image_tag.py) and pushed here, on the
      # pull request, so the image a merge deploys exists before the merge
      # and is the one built from exactly that code. A tag is never
      # overwritten: if it exists, the inputs are unchanged and so is the
      # image. Not on pull requests from forks, which can't push.
      - id: serve
        run: python3 scripts/serving/image_tag.py --github-output >> "$GITHUB_OUTPUT"

      - id: publish
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: echo "enabled=true" >> "$GITHUB_OUTPUT"

      - if: steps.publish.outputs.enabled
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: published
        if: steps.publish.outputs.enabled
        run: |
          if docker buildx imagetools inspect "${{ steps.serve.outputs.image }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.serve.outputs.image }} exists: its inputs are unchanged"
          fi

      - if: steps.publish.outputs.enabled && !steps.published.outputs.exists
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: ${{ steps.serve.outputs.target }}
          # The pull request's head commit: a real commit with the tree the
          # squash merge gets (the merge ref github.sha is on a PR is not).
          build-args: |
            UV_EXTRAS=${{ steps.serve.outputs.uv_extras }}
            GIT_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
          tags: ${{ steps.serve.outputs.image }}
          push: true
          cache-from: type=gha,scope=serve
          cache-to: type=gha,mode=max,scope=serve

      # Smoke-test the tracking stack (postgres, seaweedfs, mlflow) end to
      # end: brings the services up and waits for their healthchecks.
      # `app`/`test` are excluded (profiled), and app needs data/ anyway,
      # which isn't present in CI.
      # HOST_UID/HOST_GID default to 1000 (the usual first Linux user), but
      # the checkout on this runner is owned by *its* actual user, not 1000
      # -- without this, postgres gets "Permission denied" writing into the
      # bind-mounted ./mlflow/postgres and (observed in CI) the container's
      # "Error" status isn't one `--wait` reliably fails fast on, hanging
      # instead of erroring, hence `timeout-minutes` above too.
      - id: host-ids
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - run: docker compose up -d --wait --wait-timeout 120
        env:
          HOST_UID: ${{ steps.host-ids.outputs.uid }}
          HOST_GID: ${{ steps.host-ids.outputs.gid }}

      - run: curl -sf http://localhost:5000/health

      - if: always()
        run: docker compose logs

      - if: always()
        run: docker compose down

  # The serving image deployed the way the cluster runs it (README,
  # "Kubernetes"): deploy/k8s/overlays/ci (the kind overlay with a smoke
  # model) on a throwaway kind cluster, with the image build-and-test pushed
  # -- the pinned one, which the tests check is this commit's -- and a
  # throwaway tracking server on the runner standing in for the compose
  # stack. Then the service must answer as deployed.
  deploy-smoke:
    needs: build-and-test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - id: serve
        run: python3 scripts/serving/image_tag.py --github-output >> "$GITHUB_OUTPUT"

      - run: |
          deploy/install-tools.sh kind kubectl kubeconform
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: deploy/validate.sh

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: docker pull "${{ steps.serve.outputs.image }}"

      # On the host network, so the cluster reaches it at the kind network's
      # gateway, as it reaches the compose stack locally. `mlflow:5000` is
      # the host the pods name it by.
      - name: Tracking server with a smoke model
        env:
          IMAGE: ${{ steps.serve.outputs.image }}
        run: |
          docker run -d --name mlflow --network host "$IMAGE" mlflow server \
            --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////tmp/mlflow.db \
            --serve-artifacts --artifacts-destination /tmp/artifacts \
            --allowed-hosts mlflow:5000,localhost:5000
          timeout 120 sh -c 'until curl -sf http://localhost:5000/health; do sleep 2; done'
          docker run --rm --network host "$IMAGE" \
            python scripts/serving/smoke_model.py --tracking-uri http://localhost:5000

      - run: deploy/kind/create-cluster.sh

      - run: kind load docker-image "${{ steps.serve.outputs.image }}" --name mhd

      - run: |
          kubectl apply -k deploy/k8s/overlays/ci
          kubectl -n mhd-serving rollout status deployment/serve --timeout=300s

      - run: |
          docker run --rm --network host "${{ steps.serve.outputs.image }}" \
            python scripts/serving/smoke_check.py --url http://localhost:8080 \
            --expect-name mhd-surrogate-smoke

      # The deployment's own post-sync check (deploy/k8s/smoke-check), which
      # Argo CD runs after every sync: applied without Argo CD, it ran once.
      - run: |
          kubectl -n mhd-serving wait --for=condition=complete job/smoke-check --timeout=300s
          kubectl -n mhd-serving logs job/smoke-check

      - if: failure()
        run: |
          kubectl -n mhd-serving get all || true
          kubectl -n mhd-serving describe pods || true
          kubectl -n mhd-serving logs deployment/serve --all-containers --prefix || true
          kubectl -n mhd-serving logs job/smoke-check || true
          docker logs mlflow || true
