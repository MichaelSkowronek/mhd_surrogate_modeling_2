# Datasets the analysis suite (scripts/analysis/*.py) may read.
#
# Used to be a per-dataset trailing time split (train/val/test regions
# within each dataset, sized off the flow's dominant period) -- that's
# superseded now that model training itself uses a dataset-level split
# instead (configs/data/re16k.yaml): 7 datasets used in full for training,
# 1 held out in full for validation, 1 held out in full for final testing.
# See the README's "Train / val / test split" section for that history and
# the full reasoning behind it.
#
# re16k_t400_5 is excluded here for exactly that reason: it's
# configs/data/re16k.yaml's `test_dataset`, and must never be read by any
# script, including this project's own analysis suite, from here on.
# re16k_t400_6 (the val dataset) stays in this list -- val data is fair
# game to look at during development, unlike test.
#
# Every listed dataset is now read in full by scripts/analysis/*.py (no
# more internal train/val/test carve-up), since only whole-dataset
# exclusion matters going forward.

zarr_store: data/processed/re16k_t400.zarr

datasets:
  - re16k_t400_0
  - re16k_t400_1
  - re16k_t400_2
  - re16k_t400_3
  - re16k_t400_4
  - re16k_t400_6
  - re16k_t400_9
  - re16k_t400_10
