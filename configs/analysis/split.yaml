# Train+val / test split configuration.
#
# Splitting is time-based (trailing): the last `test_fraction` of each
# dataset's time steps become the held-out test set; the rest, still called
# "train" in the split manifest below, is the train+val region -- the actual
# train/val boundary within it isn't decided yet. scripts/analysis/*.py only
# ever read this region, never the test region, to avoid data snooping (see
# CLAUDE.md's Testing section). A random split would also leak information
# between temporally autocorrelated snapshots, hence trailing rather than
# random.
#
# test_fraction is a conservative placeholder; the actual dataset
# selection/split sizing is decided later (see CLAUDE.md), once the analysis
# this config feeds has been reviewed in full.

zarr_store: data/processed/re16k_t400.zarr

datasets:
  - re16k_t400_0
  - re16k_t400_1
  - re16k_t400_2
  - re16k_t400_3
  - re16k_t400_4
  - re16k_t400_5
  - re16k_t400_6
  - re16k_t400_9
  - re16k_t400_10

test_fraction: 0.4  # train+val gets the remaining, conservative 60%

# Snapshots dropped from the END of the train+val region, so its last
# snapshot is separated from the first test snapshot. The test set keeps its
# full `test_fraction`. In snapshot steps (the physical time step is
# unknown).
#
# 20 is derived from scripts/analysis/check_autocorrelation.py, checked
# across all 9 datasets above: the direct (monotone) field decorrelation
# crosses zero within 6-11 steps and drops below 0.05 within 6-10 steps in
# every dataset/channel, so 20 clears that with margin. Every dataset also
# shows a persistent quasi-periodic component (period ~24-40 steps,
# dataset-dependent) whose amplitude does *not* decay away -- it is still
# routinely 0.2-0.5 correlated at lag ~150 in every dataset checked -- so no
# buffer size within a practical fraction of the train+val region removes
# it; buffering past the fast decorrelation has diminishing returns against
# shrinking train+val further. See the README's "Temporal autocorrelation"
# section for the full analysis.
buffer_steps: 20
