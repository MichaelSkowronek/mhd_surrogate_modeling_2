# Train/test split configuration.
#
# Splitting is time-based (trailing): the last `test_fraction` of each
# dataset's time steps become the test set, the rest is train. A random
# split would leak information between temporally autocorrelated snapshots.

zarr_store: data/processed/re16k_t400.zarr

datasets:
  - re16k_t400_0
  - re16k_t400_1
  - re16k_t400_2
  - re16k_t400_3
  - re16k_t400_4
  - re16k_t400_5
  - re16k_t400_6
  - re16k_t400_9
  - re16k_t400_10

test_fraction: 0.2

# Snapshots dropped from the END of the training region, so the last training
# snapshot is separated from the first test snapshot. The test set keeps its
# full `test_fraction`. In snapshot steps (the physical time step is unknown).
# 10 follows the autocorrelation check for re16k_t400_0: the pooled field
# autocorrelation falls below 0.05 after ~8 steps. It does not remove the
# recurring quasi-periodic correlation (period ~25 steps) at longer lags.
buffer_steps: 10
