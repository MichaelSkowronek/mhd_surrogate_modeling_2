# Sliding-window sampling over a dataset (see configs/data/re16k.yaml for
# which ones and their train/val/test roles).
#
# Each sample is `window` consecutive time steps as input and the following
# `horizon` time steps as target. New samples start every `stride` steps.
# These are placeholder defaults (short history, one-step-ahead prediction),
# not tied to any model yet -- revisit once one exists.

window: 4
horizon: 1
stride: 1
