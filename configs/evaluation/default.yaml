# Scoring after training (src/mhd_surrogate/evaluation/evaluate.py): the
# validation dataset, plus `train_datasets` as a sanity check.
#
# final: score the model in full at the end of a training run. The DVC
#   `train` stage turns it off: its `evaluate` stage scores the stored
#   checkpoint instead (scripts/evaluation/evaluate_checkpoint.py), so a
#   change to the evaluation code re-scores the model instead of retraining
#   it.
# The context length is part of the data protocol: data.context_steps.
#
# skill_threshold: RMSE in units of the training std; the skill horizon is how
#   many lead steps stay at or below it. Persistence is already at ~0.5 one
#   step ahead and the mean field at ~0.85, so a model with skill beats both.
# report_leads: lead times (1-based) also logged as scalars, besides the full
#   per-step curve; 40 is the longest characteristic period found in the EDA.
#
# stability: how long the forecast stays bounded
#   (src/mhd_surrogate/evaluation/stability.py). The forecast is cut into
#   `block_steps`-step blocks; a block fails when its mean kinetic energy or
#   enstrophy exceeds `max_ratio` times the truth's largest block mean, and
#   `stable_steps` counts the steps before the first failing block. The
#   truth's own 100-step block means vary by ~5% (energy) and ~18%
#   (enstrophy) on the validation dataset, so 2x is a blow-up, not noise.
#
# ensemble_size: members a stochastic (generative) model forecasts, seeds
#   0..n-1, for the ensemble scores (CRPS, spread vs error; see
#   src/mhd_surrogate/evaluation/ensemble.py). A deterministic model has a
#   single member whatever this says, so it doesn't change their scores.
#   Every other score is the seed-0 member's.
# member_batch: members sampled per call by a model that can batch them
#   (`predict_members`): throughput on a GPU with room to spare, 1 = one
#   member per call. Batching can change float rounding, so it is part of
#   what reproduces an ensemble's scores (a DVC param once a stochastic model
#   is canonical; it can't change a deterministic model's).
#
# tie_break_lead: candidates are ranked by stable steps, then by skill
#   horizon, ties broken by the RMSE at this lead (CLAUDE.md, "Data
#   analysis"); early stopping and the hyperparameter search maximize the
#   three combined (`selection_score`).
#
# gate: the bar the canonical model must still meet when the DVC pipeline
#   retrains it (src/mhd_surrogate/evaluation/gate.py, the `gate` stage):
#   stable over the whole validation forecast and over a `rollout_steps`
#   rollout from the validation context (the `stability` blocks and
#   threshold), and every `max_scores` validation score at or below its
#   limit. The limits are frozen when a model becomes canonical -- its
#   validation scores then plus the margins a replacement may be worse by
#   (0.03 energy/enstrophy errors, 0.05 spectrum distances) -- and change
#   only with the next switch. Current: Hankel DMD's (0.2635, 0.7276,
#   2.623, 2.097). The domain-mean u_y drift limits are absolute instead,
#   the same for every model: the forecast's domain-mean u_y within one
#   truth std of the truth's mean and varying at most 2x as much (a
#   different realization scores <= 0.15 and 0.98-1.02; the truth's
#   domain-mean u_y is nearly conserved, std 0.0055 against a per-pixel
#   0.44).
#
# train_datasets: train datasets also scored the same way, logged as
#   `train.<name>.*` -- a sanity check of the fit and the train/val gap, not
#   a basis for decisions. One by default (~35 s each); must be a subset of
#   data.train_datasets.
final: true
skill_threshold: 0.5
report_leads: [1, 10, 40, 100]
stability:
  block_steps: 100
  max_ratio: 2.0
ensemble_size: 8
member_batch: 1
tie_break_lead: 10
gate:
  rollout_steps: 3000
  max_scores:
    energy_rel_error: 0.294
    enstrophy_rel_error: 0.758
    spectrum_x_lsd: 2.673
    spectrum_y_lsd: 2.147
    u_y_mean_offset: 1.0
    u_y_mean_std_ratio: 2.0
train_datasets: [re16k_t400_0]
