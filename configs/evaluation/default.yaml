# Scoring after training (src/mhd_surrogate/evaluation/evaluate.py): the
# validation dataset, plus `train_datasets` as a sanity check.
#
# final: score the model in full at the end of a training run. The DVC
#   `train` stage turns it off: its `evaluate` stage scores the stored
#   checkpoint instead (scripts/evaluation/evaluate_checkpoint.py), so a
#   change to the evaluation code re-scores the model instead of retraining
#   it.
# The context length is part of the data protocol: data.context_steps.
#
# skill_threshold: CRPS in units of the training std (for a deterministic
#   model, a one-member ensemble, its absolute error); the skill horizon is
#   how many lead steps stay at or below it (the selection rule's: of the
#   CRPS averaged over the `multistart` starts). On the CRPS rather than a
#   member's RMSE because pointwise error penalizes a realistic forecast twice
#   once it has lost the truth's phase -- for missing the truth's features and
#   for placing its own where the truth has none -- and so favors forecasts
#   that smooth toward the mean (the U-Net's RMSE saturates at ~1.45, Hankel
#   DMD's damped forecast's at ~0.82); the CRPS is proper, credits an
#   ensemble's spread, and is unbiased from two members on. 0.32 is half the
#   mean field's CRPS (0.64 over the first 40 leads), as RMSE 0.5 was about
#   half the mean field's RMSE (0.9). A member's absolute error is 0.51-0.65x
#   its RMSE at the RMSE horizon (the logged U-Net and Hankel DMD runs), so
#   0.32 keeps Hankel DMD's horizon at 7 and moves the U-Nets' by 0 to +3
#   (sharper forecasts have heavier-tailed errors, less of them squared).
#   Persistence stays under it for one step (0.28 at lead 1; an RMSE of 0.51
#   was just over 0.5), the mean field for none.
# report_leads: lead times (1-based) also logged as scalars, besides the full
#   per-step curve, for the forecast from the context's end and the
#   multi-start curve (`multistart_crps_lead_<n>`); 40 is the longest
#   characteristic period found in the EDA.
#
# multistart: the skill the selection rule ranks by (CLAUDE.md, "Data
#   analysis"; src/mhd_surrogate/evaluation/selection.py's start_ensembles).
#   A forecast from every `stride` frames from the context's end, as many
#   as are followed by `leads` frames of truth (31 on the validation
#   dataset, frames 80-680; 47 on re16k_t400_0), each an ensemble
#   (`monitor_members` at a validation during training, `ensemble_size`
#   when scored), scored against the truth at the same frames; its CRPS
#   averaged per lead over the starts. The horizon is that curve's, capped
#   at `leads`; ties are broken by the averaged CRPS at `tie_break_lead`
#   below the cap and by its mean over all `leads` at the cap. One
#   trajectory's skill swings on its own events: every model's CRPS from
#   frame 80 has a hump at leads 23-26, which a model ~0.04 better would
#   clear, jumping from a horizon of ~12 to ~140, and frame 80 is the
#   hardest of 32 starts for every flow-matching model (horizon 10-12, the
#   median start's 42-50). Averaged over 16 starts the hump is gone
#   (largest dip 0.007) and two disjoint halves of them rank the models
#   alike. 237 = 917 - 680: every start reaches it, so every lead averages
#   all of them. Past it only the earliest starts would remain, whose curve
#   differs from the late ones' by ~0.02 at leads 151-200 (~0.01 on the
#   average, ~50 leads of horizon on flow matching's flat curve), in
#   opposite directions for the linear and the flow-matching models.
#   stride 20 (40 until 2026-11-25): twice the starts, each with its own
#   members' draws, halve the per-epoch horizon's noise (`monitor_members`
#   below), and the starts' phases of the flow's coherent oscillation
#   (domain-mean u_y) spread on any dataset. Its period is 24.8-36.3 frames
#   on the readable datasets (25.1 on validation) and its phase drifts
#   little, so a stride near a whole period bunches the starts: 40 would
#   for a period of ~38 or more, which the test dataset's could be (it
#   can't be looked at); 20 advances 0.5-0.83 cycles for any period of
#   24-40. The starts' mean resultant length (1 = one phase) is 0.00-0.08
#   with 20, 0.05-0.21 with 40 (up to 0.55 with 44). Insurance, not a
#   measured bias: over the 31 starts the phase explains 2-20% of a
#   start's CRPS at lead 10 (README, "The stride").
#   bootstrap: the final scoring's interval of that horizon over the starts
#   (`_p05`, `_p95`; src/mhd_surrogate/evaluation/bootstrap.py), a circular
#   block bootstrap of runs of `block` consecutive starts (neighbours share
#   the trajectory's events; 8, 160 frames, as 4 were at stride 40),
#   `resamples` resamples drawn from `seed`.
#   Each start's members have seeds of their own (`ensemble_size` below),
#   so resampling the starts resamples the members' draws too: the interval
#   covers which starts and which draws, not which network a refit trains.
#   Reported, not selected on.
#
# stability: how long a forecast stays bounded
#   (src/mhd_surrogate/evaluation/stability.py). The forecast is cut into
#   `block_steps`-step blocks; a block fails when its mean kinetic energy or
#   enstrophy exceeds `max_ratio` times the validation truth's largest
#   block mean, and `stable_steps` counts the steps before the first
#   failing block. The truth's own 100-step block means vary by ~5%
#   (energy) and ~18% (enstrophy) on the validation dataset, so 2x is a
#   blow-up, not noise. The same blocks and threshold judge the validation
#   forecast and the `rollouts`.
#   `neighbors`: early stopping and the search judge a validation with the
#   2 * neighbors + 1 validations nearest it (shifted inward at the ends of
#   the run), its usable fraction being the share of their rollouts usable
#   (`rollouts` below), all of them pooled
#   (src/mhd_surrogate/evaluation/selection.py's RunSelection): a network
#   usable at one epoch and not the next is a lucky draw a refit for the
#   same epochs is unlikely to repeat, and so is a usable sample. 2 (5
#   validations, a sixth of a 30-epoch schedule) separated a lone stable
#   epoch (0.2) from a stable stretch (0.6-1.0) in the U-Net runs; 1 can't
#   tell a lone one (0.33) from much, 3 spans enough of the learning-rate
#   schedule that the neighbors are no longer much the same network.
#
# rollouts: what early stopping and the search judge stability by (CLAUDE.md,
#   "Data analysis"; selection.py's monitor_rollouts): every validation
#   rolls a model out for `steps` steps, past the data, from each of
#   `monitor_starts` frames after the context's end (frames 80 and 400 of
#   the validation dataset; multiples of `multistart.stride`, each drawing
#   its seed from that start's range), with a new seed at every validation
#   (protocol.py's rollout_seed: failures follow the seed, so with one seed
#   at every validation the usable fraction would measure that seed). A
#   rollout is usable if it is stable over all `steps` and, over its first
#   `drift_band.window_steps`, in the climatological drift band;
#   `rollout_stable_steps` is the median over a validation's rollouts
#   (`usable_threshold` below for how they rank).
#   3000 is the gate's rollout length (`gate.rollout_steps`, until the
#   final scoring's pooled rollouts replace the gate's own).
#
# drift_band: the climatological drift band (src/mhd_surrogate/evaluation/
#   usable.py): over a rollout's first `window_steps` steps, each channel's
#   domain-mean velocity within `max_offset` units of the real flow's level
#   and its std over time at most `max_std_ratio` units, the units and
#   level those of `climatology` (src/mhd_surrogate/data/climatology.py,
#   the compute_climatology DVC stage: the training datasets'
#   `window_steps`-frame windows every `stride` frames). Against the
#   climatology rather than the validation truth because the truth covers
#   frames 80-916 only, which a rollout from a later start doesn't, while
#   the real bulk flow declines through every record (~0.6 units per 1000
#   frames); the first `window_steps` steps only, since later ones reach
#   times since the records' start that no record shows. 837 = the
#   validation forecast's length. The unit is the windows' median std over
#   time (u_x: 0.36% of the bulk flow, u_y: 0.0055). The limits keep the
#   old band's: 1 unit is ~2.6x the largest real window's offset (u_x:
#   0.34 in the 66 training windows, 0.30-0.38 for the validation ones; u_y
#   <= 0.09), as the old 1 was ~3x a different realization's; 2 lets a
#   forecast vary at most twice as much as the truth within a window (real
#   windows: 0.85-1.19 on u_x, 0.97-1.02 on u_y). Measured on the kept
#   checkpoints' 3000-step rollouts from all 31 starts (2026-11-26): in the
#   band Hankel DMD and latent_linear 100%, flow matching 73-98% (seed 43's
#   bulk flow sits ~0.6 units high). `block_steps` and `slow_from`: the
#   slow-variability ratio, logged only -- the std of a rollout's
#   `block_steps`-step block means within each `window_steps` window from
#   step `slow_from` on, over the real windows' (flow matching 1.35-1.54,
#   the real validation windows 0.76-1.57).
#
# usable_threshold: the selection rule's first key (metrics.py's
#   selection_score): every validation whose window's rollouts (pooled over
#   the `stability.neighbors` window, 10 rollouts) are usable at least this
#   often ranks above every one that aren't, these by their fraction; then
#   the pooled rollouts' median stable steps, then the validation's own
#   skill. Pooled because a validation's own two rollouts, with new seeds,
#   are largely luck (both survive with p^2 for a per-rollout survival p).
#   0.8 as the stable fraction's floor was: 8 of a window's 10 rollouts.
#   A validation neither of whose own two is usable doesn't count as
#   reaching it (ranked by its fraction below the threshold, still above
#   every window short of it): they are the only direct look at its network.
#
# ensemble_size: members a stochastic (generative) model forecasts when it
#   is scored: from the context's end seeds 0..n-1, and from each
#   `multistart` start seeds of its own, member m of the k-th start (the
#   context's end the 0th) drawing 1000 k + m
#   (src/mhd_surrogate/evaluation/protocol.py's start_seeds): one seed at
#   every start would replay the same noise sequence from each (a step's
#   noise comes from the seed and the step's index), and run 1's rollout
#   failures clustered by seed, not by start. The skill horizon and the
#   ensemble scores (CRPS, spread vs error; see
#   src/mhd_surrogate/evaluation/ensemble.py) are the ensemble's, and every
#   score of a single trajectory -- RMSE, physics,
#   drift, stability -- is the median over its members: each member is one
#   trajectory as `predict` gives it (the ensemble mean would be smooth and
#   fail the physics), and no single member, lucky or blown up, decides.
#   Each member's own validation scores are kept too (`val.member_<seed>`):
#   the gate's absolute checks count the members that pass them
#   (`gate.min_member_fraction`). A deterministic model has a single member
#   whatever this says, so it doesn't change their scores.
# monitor_members: members a stochastic model forecasts at every validation
#   during training (src/mhd_surrogate/training/run.py's ValidationMonitor:
#   early stopping, the search), from the context's end and from every
#   `multistart` start, scored like the ensemble above, with seeds of their
#   own: member m of the k-th start draws 1000 k + 500 + m, the same at
#   every validation and never a scored member's. Early stopping keeps the
#   epoch whose members look best, so scoring those again would flatter it:
#   the kept flow-matching runs' selection seeds (0 and 1, from frame 80)
#   scored 0.7-1.2 sd better at lead 10 than 31 fresh pairs at the kept
#   epoch (2026-11-25). 4: with 2, the fewest the CRPS is unbiased
#   from, one network's multi-start horizon moved by ~19 leads (sd) from
#   one pair of seeds to the next on flow matching's flat curves (run 1:
#   62-93 over 8 disjoint pairs, at stride 40), with 4 by ~11; at stride
#   20, with each start's own seeds, 4 members move it by 4.4-7.4 over 8
#   groups of seeds (2 by 6.6-18), for 8.8 s per validation (run 1, RTX
#   3060, 2026-11-25). The usable fraction pools the validations'
#   `rollouts`, not these members.
# member_batch: members sampled per call in the scoring by a model that can
#   batch them (`predict_members`, `predict_device_blocks`), 1 = one member
#   per call. Batching can change float rounding, which a long forecast
#   amplifies, and a member is the one served for its seed only when
#   sampled alone on the serving device, so the scoring stays at 1. It is
#   part of what reproduces an ensemble's scores (a DVC param once a
#   stochastic model is canonical, like ensemble_size and monitor_members;
#   none can change a deterministic model's).
# monitor_batch: the same for the validations during training (early
#   stopping, the search), where throughput matters and a member needn't be
#   the served one: the members of a validation are sampled in one call up
#   to this many, the trajectories of several `multistart` starts together
#   by a model that can (`predict_device_batch`). Measured for latent flow
#   matching on the RTX 3060 (2026-11-23): a step of 1 member takes 1.2 ms,
#   of 2 members 2.0 ms, of 32 members 4.7 ms, of 64 members 4.8 ms, so 64
#   cost hardly more than 2; 128 makes the multi-start skill's 31 starts x
#   4 members one call (run 1's validation: 8.8 s, against 9.7 s in calls
#   of 64). A model that holds its forecasts' frames on the device bounds
#   it (`max_device_batch`: the U-Net's 16, which then takes 37.5 s per
#   validation). Part of what reproduces an iterative model's
#   early stopping, so a DVC param of the train stage once a stochastic
#   model is canonical; 1 samples every member alone, as the validations
#   before it did.
#
# tie_break_lead: candidates are ranked by stable steps, then by stable
#   fraction, then by the multi-start skill horizon, ties broken by its
#   averaged CRPS at this lead below the cap (at the cap, its mean over the
#   `multistart` leads; CLAUDE.md, "Data analysis"); early stopping and the
#   hyperparameter search maximize the four combined (`selection_score`).
#
# gate: the bar the canonical model must still meet when the DVC pipeline
#   retrains it (src/mhd_surrogate/evaluation/gate.py, the `gate` stage):
#   stable over the whole validation forecast and over a `rollout_steps`
#   rollout from the validation context (the `stability` blocks and
#   threshold), every `member_max_scores` validation score at or below its
#   limit -- these three passed all at once by at least `min_member_fraction`
#   of a stochastic model's `ensemble_size` members -- every `max_scores`
#   validation score (for a stochastic model the median over its members) at
#   or below its limit and every `min_scores` one at or above it. The first
#   three are absolute: a member that blows up or drifts is a broken
#   forecast, served to whoever asks for its seed, whichever check it fails.
#   0.8 is the stable fraction's floor, 7 of 8 members: were each member
#   broken with probability q, a q = 0.05 model
#   would pass 94% of the time (all 8 would fail it a third of the time),
#   q = 0.2 50%, q = 0.375 14% (the median member, 5 of 8, would pass that
#   one 65% of the time). The `max_scores` limits are relative, a typical
#   member against the canonical model: frozen when a model becomes
#   canonical -- its validation scores then plus the margins a replacement
#   may be worse by (0.03 energy/enstrophy errors, 0.05 spectrum distances)
#   -- and changed only with the next switch. Current: Hankel DMD's (0.2635,
#   0.7276, 2.623, 2.097). The domain-mean velocity drift limits
#   (`member_max_scores`) are absolute, the same for every model: per
#   channel, the forecast's domain-mean velocity within one truth std of the
#   truth's mean and varying at most 2x as much (a different realization
#   scores <= 0.33 and 0.76-0.96 on u_x, <= 0.15 and 0.98-1.02 on u_y). The truth's domain
#   means stay at 1 +- 0.0042 (u_x, the bulk flow) and 0 +- 0.0055 (u_y,
#   whose fluctuation is the EDA's ~25-step oscillation), against per-pixel
#   stds of 0.82 and 0.44: an empirical property of this flow, not a
#   conservation law. A drift beyond that band is a wrong bulk or
#   cross-stream flow, which the energy error doesn't see (u_y's enters it
#   squared; the U-Net baseline's 7% loss of bulk flow is offset by extra
#   fluctuation energy, a 1% energy error). The stable fraction's limit is
#   absolute too: stable_fraction >= 0.8, at least 4 of the 5 validations
#   nearest the kept epoch stable (`stability`'s neighbors; for a stochastic
#   model 16 of their 20 members), so a refit for that many epochs is likely
#   stable as well. Were each epoch stable with
#   probability p, a p = 0.9 recipe would pass 92% of the time (a limit of
#   1.0 would reject it 41% of the time by chance), a p = 0.5 one 19%. A
#   closed-form fit (Hankel DMD) is the same model on every refit: 1.0 if
#   its forecast is stable (a stochastic one's: the share of its members).
#   An iterative model trained since the rule judges rollouts reports the
#   kept window's `usable_fraction` instead, which this check doesn't read
#   yet: the gate moves to the final scoring's pooled rollouts first.
#
# train_datasets: train datasets also scored the same way, logged as
#   `train.<name>.*` -- a sanity check of the fit and the train/val gap, not
#   a basis for decisions, with the same multi-start skill (24 starts on
#   re16k_t400_0). One by default (Hankel DMD: 15 s on the GPU, against
#   12 s for the validation dataset); must be a subset of
#   data.train_datasets.
final: true
skill_threshold: 0.32
report_leads: [1, 10, 40, 100]
multistart:
  stride: 20
  leads: 237
  bootstrap:
    block: 8
    resamples: 1000
    seed: 0
stability:
  block_steps: 100
  max_ratio: 2.0
  neighbors: 2
rollouts:
  steps: 3000
  monitor_starts: [0, 320]
drift_band:
  climatology: data/processed/climatology.json
  window_steps: 837
  stride: 20
  block_steps: 100
  slow_from: 300
  max_offset: 1.0
  max_std_ratio: 2.0
usable_threshold: 0.8
ensemble_size: 8
monitor_members: 4
member_batch: 1
monitor_batch: 128
tie_break_lead: 10
gate:
  rollout_steps: 3000
  min_member_fraction: 0.8
  max_scores:
    energy_rel_error: 0.294
    enstrophy_rel_error: 0.758
    spectrum_x_lsd: 2.673
    spectrum_y_lsd: 2.147
  member_max_scores:
    u_x_mean_offset: 1.0
    u_x_mean_std_ratio: 2.0
    u_y_mean_offset: 1.0
    u_y_mean_std_ratio: 2.0
  min_scores:
    stable_fraction: 0.8
train_datasets: [re16k_t400_0]
