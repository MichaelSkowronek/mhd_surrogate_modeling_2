# Root Hydra config for training entrypoints (scripts/training/train.py and later).
#
# This is separate from configs/analysis/split.yaml and
# configs/analysis/grid.yaml, which are plain YAML consumed directly by the
# data/analysis scripts (scripts/data/split_data.py, scripts/analysis/check_*.py)
# and are not part of the Hydra config tree.

defaults:
  - data: re16k
  - dataset: windowed
  - mlflow: local
  - _self_

seed: 42

hydra:
  # Keep the working directory as the repo root: every script in this project
  # (analysis scripts included) uses paths relative to it (e.g. data/raw/...),
  # and Hydra's default of chdir-ing into the run directory would break that.
  job:
    chdir: false
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
