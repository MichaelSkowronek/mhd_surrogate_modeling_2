# Root Hydra config for training entrypoints (scripts/training/train.py and later).
#
# This is separate from configs/analysis/split.yaml and
# configs/analysis/grid.yaml, which are plain YAML consumed directly by the
# data/analysis scripts (scripts/data/split_data.py, scripts/analysis/check_*.py)
# and are not part of the Hydra config tree.

defaults:
  - data: re16k
  - dataset: windowed
  - normalization: per_channel
  - model: mean_field
  - evaluation: default
  - mlflow: local
  - override hydra/job_logging: project
  - override hydra/hydra_logging: none
  - _self_

seed: 42

# Persistent XLA compilation cache (src/mhd_surrogate/utils/jax_cache.py):
# compiled programs are reused across runs instead of recompiled (and
# re-autotuned) in every process; set compilation_cache_dir=null to disable.
#
# deterministic_ops: deterministic GPU kernels
#   (src/mhd_surrogate/utils/jax_determinism.py). A cold GPU compile
#   autotunes kernels that round differently, so without it results can
#   change from compile to compile (U-Net scores in the 3rd digit); with it,
#   every compile on the same GPU and stack gives the same bits, for ~50%
#   more training time. On for the DVC stages (reproducible outputs), off
#   for exploration.
jax:
  compilation_cache_dir: .jax_cache
  compilation_cache_max_gb: 2
  deterministic_ops: false

# Resume an interrupted run of an iteratively trained model (e.g. model=unet):
# the run's output directory, e.g. resume=outputs/2026-10-06/14-03-12, with the
# same overrides as the original run. Training continues from the last
# completed epoch in that directory (its training_state/), in the same MLflow
# run; the console log is appended to the run's log file.
resume: null

# Fixed output location, set by the DVC `train` stage (dvc.yaml): the
# checkpoint goes to <dir>/model and the scores to <dir>/metrics.json.
# Unset (the default), both stay in the run's Hydra output directory.
export:
  dir: null

hydra:
  # Keep the working directory as the repo root: every script in this project
  # (analysis scripts included) uses paths relative to it (e.g. data/raw/...),
  # and Hydra's default of chdir-ing into the run directory would break that.
  job:
    chdir: false
  run:
    # A resumed run goes back into its own directory (see `resume` above).
    dir: ${if_null:${resume},outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}}
  # Multirun sweeps (`-m`, e.g. the DMD rank sweep) go under outputs/ too, one
  # numbered subdirectory per job, instead of Hydra's default ./multirun.
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
