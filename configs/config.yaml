# Root Hydra config for training entrypoints (scripts/train.py and later).
#
# This is separate from configs/split.yaml and configs/grid.yaml, which are
# plain YAML consumed directly by the analysis scripts (scripts/split_data.py,
# scripts/check_*.py) and are not part of the Hydra config tree.

defaults:
  - data: re16k
  - _self_

seed: 42

hydra:
  # Keep the working directory as the repo root: every script in this project
  # (analysis scripts included) uses paths relative to it (e.g. data/raw/...),
  # and Hydra's default of chdir-ing into the run directory would break that.
  job:
    chdir: false
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
