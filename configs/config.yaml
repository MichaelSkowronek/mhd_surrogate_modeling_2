# Root Hydra config for training entrypoints (scripts/training/train.py and later).
#
# This is separate from configs/analysis/split.yaml and
# configs/analysis/grid.yaml, which are plain YAML consumed directly by the
# data/analysis scripts (scripts/data/split_data.py, scripts/analysis/check_*.py)
# and are not part of the Hydra config tree.

defaults:
  - data: re16k
  - dataset: windowed
  - normalization: per_channel
  - model: mean_field
  - evaluation: default
  - mlflow: local
  - override hydra/job_logging: project
  - override hydra/hydra_logging: none
  - _self_

seed: 42

# Fixed output location, set by the DVC `train` stage (dvc.yaml): the
# checkpoint goes to <dir>/model and the scores to <dir>/metrics.json.
# Unset (the default), both stay in the run's Hydra output directory.
export:
  dir: null

hydra:
  # Keep the working directory as the repo root: every script in this project
  # (analysis scripts included) uses paths relative to it (e.g. data/raw/...),
  # and Hydra's default of chdir-ing into the run directory would break that.
  job:
    chdir: false
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  # Multirun sweeps (`-m`, e.g. the DMD rank sweep) go under outputs/ too, one
  # numbered subdirectory per job, instead of Hydra's default ./multirun.
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
